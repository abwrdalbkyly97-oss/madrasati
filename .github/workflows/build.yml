name: بناء تطبيق مدرستي

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ينشئ ملفات أندرويد الناقصة بدون أن يلمس مجلد lib
      - name: Create Android files
        run: flutter create --org com.madrasati --project-name madrasati --platforms android .

      # يضيف صلاحية الإنترنت واسم التطبيق وفتح روابط يوتيوب
      - name: Patch AndroidManifest
        run: |
          python3 - <<'EOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          s = s.replace('android:label="madrasati"', 'android:label="مدرستي"')
          intent = '<intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>'
          if "<queries>" in s:
              s = s.replace("<queries>", "<queries>\n        " + intent, 1)
          else:
              s = s.replace("</manifest>", "    <queries>" + intent + "</queries>\n</manifest>")
          open(p, "w", encoding="utf-8").write(s)
          print(s)
          EOF

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: madrasati-apk
          path: build/app/outputs/flutter-apk/app-release.apk
